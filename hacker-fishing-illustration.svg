<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87ceeb;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#b0e0e6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f6ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="water-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5016;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3d0a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mountain-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b7355;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5d4e37;stop-opacity:1" />
    </linearGradient>
    <filter id="soft-blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
    </filter>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="350" fill="url(#sky-gradient)"/>
  
  <!-- Fjell i bakgrunnen (nevø på topp) -->
  <polygon points="0,350 150,150 300,350" fill="url(#mountain-gradient)" opacity="0.8"/>
  <polygon points="200,350 400,100 600,350" fill="url(#mountain-gradient)"/>
  <polygon points="550,350 700,180 800,350" fill="url(#mountain-gradient)" opacity="0.9"/>
  
  <!-- Snø på fjellene -->
  <polygon points="200,100 380,150 400,100" fill="white" opacity="0.95"/>
  <polygon points="400,100 420,150 440,100" fill="white" opacity="0.9"/>
  <polygon points="550,180 670,220 700,180" fill="white" opacity="0.95"/>
  
  <!-- Vatnet (fjorden) -->
  <rect y="350" width="800" height="250" fill="url(#water-gradient)"/>
  
  <!-- Bølger på vatnet -->
  <path d="M 0 350 Q 50 345 100 350 T 200 350 T 300 350 T 400 350 T 500 350 T 600 350 T 700 350 T 800 350" 
        fill="none" stroke="#1a5c3a" stroke-width="1.5" opacity="0.4"/>
  <path d="M 0 380 Q 60 375 120 380 T 240 380 T 360 380 T 480 380 T 600 380 T 720 380 T 800 380" 
        fill="none" stroke="#0f3d1f" stroke-width="1" opacity="0.5"/>
  
  <!-- Skog på venstre side -->
  <!-- Trær -->
  <ellipse cx="80" cy="320" rx="35" ry="50" fill="#2d5016"/>
  <ellipse cx="110" cy="310" rx="30" ry="45" fill="#3d6b1f"/>
  <polygon points="80,270 55,310 105,310" fill="#1a3d0a"/>
  <rect x="75" y="310" width="10" height="30" fill="#5d4e37"/>
  
  <ellipse cx="150" cy="330" rx="25" ry="40" fill="#2d5016"/>
  <polygon points="150,290 130,330 170,330" fill="#1a3d0a"/>
  <rect x="145" y="330" width="10" height="25" fill="#5d4e37"/>
  
  <!-- Skog på høyre side -->
  <ellipse cx="700" cy="315" rx="40" ry="55" fill="#2d5016"/>
  <ellipse cx="750" cy="325" rx="35" ry="48" fill="#3d6b1f"/>
  <polygon points="700,255 660,315 740,315" fill="#1a3d0a"/>
  <rect x="695" y="315" width="10" height="35" fill="#5d4e37"/>
  
  <!-- Mann (hackeren) som fisker -->
  <!-- Kropp -->
  <ellipse cx="420" cy="390" rx="20" ry="30" fill="#2c3e50"/>
  
  <!-- Hode -->
  <circle cx="420" cy="355" r="16" fill="#d4a574"/>
  
  <!-- Hår -->
  <ellipse cx="420" cy="345" rx="18" ry="14" fill="#3d2817"/>
  
  <!-- Ansikt -->
  <circle cx="414" cy="353" r="2.5" fill="#2c3e50"/> <!-- Øye venstre -->
  <circle cx="426" cy="353" r="2.5" fill="#2c3e50"/> <!-- Øye høyre -->
  <path d="M 420 360 Q 420 362 420 365" fill="none" stroke="#2c3e50" stroke-width="1" stroke-linecap="round"/>
  
  <!-- Arm (venstre) - holder stang -->
  <line x1="400" y1="395" x2="300" y2="310" stroke="#d4a574" stroke-width="7" stroke-linecap="round"/>
  <circle cx="300" cy="310" r="5" fill="#d4a574"/> <!-- Hånd -->
  
  <!-- Arm (høyre) ved siden -->
  <line x1="440" y1="395" x2="480" y2="410" stroke="#d4a574" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Ben -->
  <line x1="415" y1="420" x2="410" y2="480" stroke="#4a5568" stroke-width="8" stroke-linecap="round"/>
  <line x1="425" y1="420" x2="430" y2="480" stroke="#4a5568" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Sko -->
  <ellipse cx="410" cy="485" rx="6" ry="5" fill="#2c3e50"/>
  <ellipse cx="430" cy="485" rx="6" ry="5" fill="#2c3e50"/>
  
  <!-- Fiskestang -->
  <line x1="300" y1="310" x2="180" y2="480" stroke="#8b6f47" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  
  <!-- Fiskesnor -->
  <path d="M 180 480 Q 150 500 140 540" fill="none" stroke="#c0a080" stroke-width="1.5" opacity="0.7" stroke-dasharray="2,3"/>
  
  <!-- Fisk på kroken -->
  <ellipse cx="135" cy="550" rx="8" ry="6" fill="#ff6b35"/>
  <polygon points="135,550 142,548 145,552" fill="#ff8c42"/>
  <circle cx="138" cy="549" r="1.5" fill="white" opacity="0.8"/>
  
  <!-- Vannsprut fra fisk -->
  <circle cx="128" cy="545" r="2" fill="#90e0ef" opacity="0.6"/>
  <circle cx="125" cy="540" r="1.5" fill="#90e0ef" opacity="0.5"/>
  
  <!-- Digitale elementer (subtile) - som hvis hackeren er connectet -->
  <!-- Binære linjer rundt figuren -->
  <text x="350" y="300" font-family="monospace" font-size="10" fill="#2563eb" opacity="0.3">1011010</text>
  <text x="500" y="420" font-family="monospace" font-size="9" fill="#06b6d4" opacity="0.25">0110</text>
  
  <!-- Lys refleks på vatnet fra solen -->
  <path d="M 400 450 Q 410 500 420 550" fill="none" stroke="#90e0ef" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  
  <!-- Sol i bakgrunnen (reflektert) -->
  <circle cx="650" cy="150" r="40" fill="#ffeb3b" opacity="0.6" filter="url(#soft-blur)"/>
  <circle cx="650" cy="150" r="35" fill="#ffc107" opacity="0.4"/>
  
  <!-- Fugler -->
  <g opacity="0.6">
    <path d="M 100 200 Q 110 195 120 200" fill="none" stroke="#5d4e37" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 200 180 Q 215 175 230 180" fill="none" stroke="#5d4e37" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 680 210 Q 700 200 720 210" fill="none" stroke="#5d4e37" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- Stillesamt ordtak (tekst) -->
  <text x="420" y="580" font-family="Georgia, serif" font-size="18" text-anchor="middle" fill="#1a3d0a" opacity="0.5" font-style="italic">
    Stillhet og kodeLinja
  </text>
</svg>
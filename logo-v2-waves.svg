  <path d="M 30 70 Q 50 40 70 70 T 110 70 T 150 70 T 190 70" 
        stroke="url(#grad)" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Sentral puls -->
  <circle cx="100" cy="100" r="6" fill="url(#grad)"/>

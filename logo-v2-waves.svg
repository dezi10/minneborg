<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Bølgeform som representerer data/energi -->
  <path d="M 30 100 Q 50 70 70 100 T 110 100 T 150 100 T 190 100" 
        stroke="url(#grad)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M 30 130 Q 50 100 70 130 T 110 130 T 150 130 T 190 130" 

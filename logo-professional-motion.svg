<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-motion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-motion-rev" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Motion/bevegelse design - piler i ulike retninger -->
  <!-- Pil 1 - oppover høyre -->
  <g opacity="0.9">
    <path d="M 40 130 L 110 60" fill="none" stroke="url(#grad-motion)" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="110,60 105,73 118,68" fill="url(#grad-motion)"/>
  </g>
  
  <!-- Pil 2 - nedover høyre -->
  <g opacity="0.7">
    <path d="M 110 60 L 160 130" fill="none" stroke="url(#grad-motion-rev)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="160,130 150,121 155,134" fill="url(#grad-motion-rev)"/>
  </g>
  
  <!-- Pil 3 - til siden -->
  <g opacity="0.75">
    <path d="M 50 100 L 140 100" fill="none" stroke="url(#grad-motion)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="140,100 125,95 130,105" fill="url(#grad-motion)"/>
  </g>
  
  <!-- Sentral sirkel som connector -->
  <circle cx="100" cy="95" r="5.5" fill="url(#grad-motion-rev)"/>
  <circle cx="100" cy="95" r="2.5" fill="white" opacity="0.6"/>
</svg>
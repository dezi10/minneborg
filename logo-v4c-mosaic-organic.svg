<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" />
    </filter>
  </defs>
  
  <!-- Sirkler i stedet for kvadrater - organisk mosaikkfølelse -->
  <circle cx="35" cy="40" r="22" fill="url(#grad1)" opacity="0.9"/>
  <circle cx="100" cy="30" r="26" fill="url(#grad2)" opacity="1"/>
  <circle cx="160" cy="45" r="22" fill="url(#grad1)" opacity="0.8"/>
  
  <circle cx="30" cy="110" r="24" fill="url(#grad2)" opacity="0.95"/>
  <circle cx="100" cy="105" r="30" fill="url(#grad1)" opacity="1"/>
  <circle cx="165" cy="110" r="24" fill="url(#grad2)" opacity="0.9"/>
  
  <circle cx="40" cy="170" r="22" fill="url(#grad1)" opacity="0.85"/>
  <circle cx="100" cy="165" r="26" fill="url(#grad2)" opacity="0.95"/>
  <circle cx="155" cy="170" r="22" fill="url(#grad1)" opacity="0.85"/>
  
  <!-- Forbindelseslinjer mellom sirkler -->
  <line x1="55" y1="60" x2="80" y2="85" stroke="url(#grad1)" stroke-width="3" opacity="0.3" stroke-linecap="round"/>
  <line x1="125" y1="65" x2="145" y2="85" stroke="url(#grad2)" stroke-width="3" opacity="0.3" stroke-linecap="round"/>
  <line x1="70" y1="140" x2="85" y2="150" stroke="url(#grad1)" stroke-width="3" opacity="0.25" stroke-linecap="round"/>
  <line x1="120" y1="140" x2="140" y2="150" stroke="url(#grad2)" stroke-width="3" opacity="0.25" stroke-linecap="round"/>
  
  <!-- Sentrale hex-punkter -->
  <circle cx="100" cy="105" r="20" fill="none" stroke="url(#grad1)" stroke-width="1.5" opacity="0.2"/>
  <circle cx="100" cy="105" r="8" fill="url(#grad2)" opacity="0.6"/>
  <circle cx="100" cy="105" r="4" fill="url(#grad1)"/>
</svg>
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Ekspanderende mosaikkfølelse - som vekst -->
  <!-- Øverst - små -->
  <rect x="80" y="20" width="25" height="25" fill="url(#grad1)" opacity="0.8" transform="rotate(20 92 32)"/>
  <rect x="40" y="35" width="22" height="22" fill="url(#grad2)" opacity="0.7" transform="rotate(-15 51 46)"/>
  <rect x="125" y="40" width="22" height="22" fill="url(#grad1)" opacity="0.7" transform="rotate(10 136 51)"/>
  
  <!-- Midten - medium -->
  <rect x="15" y="80" width="38" height="38" fill="url(#grad2)" opacity="0.9" transform="rotate(-25 34 99)"/>
  <rect x="75" y="70" width="45" height="45" fill="url(#grad1)" opacity="1" transform="rotate(30 97 92)"/>
  <rect x="140" y="78" width="38" height="38" fill="url(#grad2)" opacity="0.9" transform="rotate(-20 159 97)"/>
  
  <!-- Nedten - større -->
  <rect x="10" y="140" width="45" height="45" fill="url(#grad1)" opacity="0.95" transform="rotate(25 32 162)"/>
  <rect x="72" y="130" width="52" height="52" fill="url(#grad2)" opacity="1" transform="rotate(-35 98 156)"/>
  <rect x="135" y="138" width="45" height="45" fill="url(#grad1)" opacity="0.95" transform="rotate(20 157 160)"/>
  
  <!-- Strålende forbindelser -->
  <line x1="92" y1="50" x2="97" y2="75" stroke="url(#grad1)" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>
  <line x1="60" y1="60" x2="75" y2="80" stroke="url(#grad2)" stroke-width="2.5" opacity="0.3" stroke-linecap="round"/>
  <line x1="140" y1="65" x2="130" y2="85" stroke="url(#grad1)" stroke-width="2.5" opacity="0.3" stroke-linecap="round"/>
  
  <line x1="100" y1="125" x2="75" y2="145" stroke="url(#grad2)" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/>
  <line x1="100" y1="125" x2="130" y2="150" stroke="url(#grad1)" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/>
  
  <!-- Sentral energi -->
  <circle cx="100" cy="100" r="16" fill="url(#grad1)" opacity="0.12"/>
  <circle cx="100" cy="100" r="6" fill="url(#grad1)" opacity="0.7"/>
  <circle cx="100" cy="100" r="2.5" fill="url(#grad2)"/>
</svg>
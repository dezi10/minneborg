<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Større, dristigere bokser -->
  <rect x="15" y="25" width="50" height="50" fill="url(#grad1)" opacity="1" transform="rotate(35 40 50)"/>
  <rect x="75" y="10" width="55" height="55" fill="url(#grad1)" opacity="0.9" transform="rotate(-40 102 37)"/>
  <rect x="130" y="30" width="50" height="50" fill="url(#grad1)" opacity="0.95" transform="rotate(25 155 55)"/>
  
  <!-- Kraftig midtrad -->
  <rect x="10" y="90" width="52" height="52" fill="url(#grad1)" opacity="0.95" transform="rotate(-30 36 116)"/>
  <rect x="75" y="80" width="60" height="60" fill="url(#grad1)" opacity="1" transform="rotate(45 105 110)"/>
  <rect x="130" y="90" width="52" height="52" fill="url(#grad1)" opacity="0.95" transform="rotate(-25 156 116)"/>
  
  <!-- Nedre statement -->
  <rect x="20" y="145" width="48" height="48" fill="url(#grad1)" opacity="0.9" transform="rotate(30 44 169)"/>
  <rect x="80" y="135" width="55" height="55" fill="url(#grad1)" opacity="1" transform="rotate(-35 107 162)"/>
  <rect x="135" y="150" width="48" height="48" fill="url(#grad1)" opacity="0.9" transform="rotate(20 159 174)"/>
  
  <!-- Tykkere forbindelseslinjer -->
  <line x1="50" y1="75" x2="95" y2="95" stroke="url(#grad1)" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
  <line x1="150" y1="85" x2="115" y2="105" stroke="url(#grad1)" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
  <line x1="105" y1="145" x2="75" y2="165" stroke="url(#grad1)" stroke-width="4" opacity="0.4" stroke-linecap="round"/>
  <line x1="105" y1="145" x2="140" y2="170" stroke="url(#grad1)" stroke-width="4" opacity="0.4" stroke-linecap="round"/>
  
  <!-- Stor sentral puls -->
  <circle cx="100" cy="105" r="15" fill="url(#grad1)" opacity="0.2"/>
  <circle cx="100" cy="105" r="9" fill="url(#grad1)"/>
</svg>
<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sketch-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f0f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5e5e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sketch-water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d4c0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9b8a0;stop-opacity:1" />
    </linearGradient>
    <filter id="pencil-texture">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise" seed="2"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1" />
    </filter>
  </defs>
  
  <!-- Skissert himmel (tegning stil) -->
  <rect width="800" height="350" fill="url(#sketch-sky)"/>
  
  <!-- Skisserte fjell (hand-drawn effekt) -->
  <path d="M 0 350 Q 40 300 80 280 Q 120 260 150 200 Q 180 240 200 300 Q 220 330 240 350" 
        fill="#d0d0d0" stroke="#666" stroke-width="2" filter="url(#pencil-texture)"/>
  
  <path d="M 200 350 Q 280 300 350 150 Q 420 200 480 120 Q 540 200 600 280 Q 650 320 700 350" 
        fill="#d9d9d9" stroke="#666" stroke-width="2" filter="url(#pencil-texture)"/>
  
  <path d="M 650 350 Q 680 320 700 250 Q 720 300 750 200 Q 780 250 800 350" 
        fill="#d0d0d0" stroke="#666" stroke-width="2" filter="url(#pencil-texture)"/>
  
  <!-- Snø-skisser -->
  <path d="M 150 200 L 145 220 L 155 220 Z" fill="white" stroke="#aaa" stroke-width="1" opacity="0.7"/>
  <path d="M 480 120 L 470 150 L 490 150 Z" fill="white" stroke="#aaa" stroke-width="1" opacity="0.7"/>
  
  <!-- Skissert skog -->
  <g filter="url(#pencil-texture)" opacity="0.7">
    <path d="M 60 330 Q 40 300 50 260 Q 70 290 80 330" fill="#a8a89c" stroke="#666" stroke-width="1.5"/>
    <path d="M 100 340 Q 85 310 95 280 Q 115 305 125 340" fill="#a8a89c" stroke="#666" stroke-width="1.5"/>
  </g>
  
  <g filter="url(#pencil-texture)" opacity="0.6">
    <path d="M 740 340 Q 720 310 730 270 Q 755 300 770 340" fill="#a8a89c" stroke="#666" stroke-width="1.5"/>
    <path d="M 780 345 Q 765 315 775 280 Q 800 310 815 345" fill="#a8a89c" stroke="#666" stroke-width="1.5"/>
  </g>
  
  <!-- Vatn (skissert) -->
  <rect y="350" width="800" height="250" fill="url(#sketch-water)"/>
  
  <!-- Skisserte bølger -->
  <g filter="url(#pencil-texture)" opacity="0.6" stroke="#999" stroke-width="1.5" fill="none">
    <path d="M 0 370 Q 50 360 100 370 T 200 370 T 300 370 T 400 370 T 500 370 T 600 370 T 700 370 T 800 370"/>
    <path d="M 0 410 Q 60 400 120 410 T 240 410 T 360 410 T 480 410 T 600 410 T 720 410 T 800 410"/>
  </g>
  
  <!-- Mann (skisse-stil) -->
  <!-- Hode (sirkel skisse) -->
  <circle cx="420" cy="360" r="16" fill="none" stroke="#333" stroke-width="2.5" filter="url(#pencil-texture)"/>
  
  <!-- Øyne (enkle) -->
  <circle cx="414" cy="358" r="2" fill="#333"/>
  <circle cx="426" cy="358" r="2" fill="#333"/>
  
  <!-- Nese -->
  <line x1="420" y1="360" x2="420" y2="365" stroke="#333" stroke-width="1" filter="url(#pencil-texture)"/>
  
  <!-- Munn (smil) -->
  <path d="M 416 368 Q 420 370 424 368" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" filter="url(#pencil-texture)"/>
  
  <!-- Hår (skisset) -->
  <path d="M 405 350 Q 400 340 410 335 Q 420 330 430 335 Q 440 340 435 350" fill="none" stroke="#333" stroke-width="2" filter="url(#pencil-texture)"/>
  
  <!-- Kropp -->
  <path d="M 408 375 L 410 410 M 432 375 L 430 410" stroke="#333" stroke-width="2.5" filter="url(#pencil-texture)"/>
  
  <!-- Arm (fiskestang side) -->
  <path d="M 408 380 Q 320 330 280 310" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round" filter="url(#pencil-texture)"/>
  <circle cx="280" cy="310" r="4" fill="none" stroke="#333" stroke-width="2"/>
  
  <!-- Arm (høyre) -->
  <path d="M 432 380 L 480 410" stroke="#333" stroke-width="2" stroke-linecap="round" filter="url(#pencil-texture)"/>
  
  <!-- Ben -->
  <line x1="410" y1="410" x2="405" y2="475" stroke="#333" stroke-width="2.5" stroke-linecap="round" filter="url(#pencil-texture)"/>
  <line x1="430" y1="410" x2="435" y2="475" stroke="#333" stroke-width="2.5" stroke-linecap="round" filter="url(#pencil-texture)"/>
  
  <!-- Sko (enkle) -->
  <line x1="405" y1="475" x2="415" y2="475" stroke="#333" stroke-width="2" filter="url(#pencil-texture)"/>
  <line x1="435" y1="475" x2="445" y2="475" stroke="#333" stroke-width="2" filter="url(#pencil-texture)"/>
  
  <!-- Fiskestang (tegnet) -->
  <line x1="280" y1="310" x2="150" y2="480" stroke="#333" stroke-width="3" stroke-linecap="round" filter="url(#pencil-texture)"/>
  
  <!-- Snor -->
  <path d="M 150 480 Q 120 510 110 545" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="3,2" filter="url(#pencil-texture)"/>
  
  <!-- Fisk -->
  <ellipse cx="105" cy="555" rx="6" ry="4" fill="none" stroke="#333" stroke-width="2" filter="url(#pencil-texture)"/>
  <polygon points="105,555 112,553 113,557" fill="none" stroke="#333" stroke-width="1.5" filter="url(#pencil-texture)"/>
  
  <!-- Tekst (håndskrift stil) -->
  <text x="420" y="570" font-family="cursive" font-size="18" text-anchor="middle" fill="#666" opacity="0.7" filter="url(#pencil-texture)">
    Fishing for insights
  </text>
</svg>
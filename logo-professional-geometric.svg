<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-geometric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Geometrisk, moderne design - triangler som representerer pakker -->
  <polygon points="100,30 140,70 100,75 60,70" fill="url(#grad-geometric)" opacity="0.9"/>
  <polygon points="70,85 90,95 85,120 60,110" fill="url(#grad-geometric)" opacity="0.8"/>
  <polygon points="130,85 150,95 155,120 130,115" fill="url(#grad-geometric)" opacity="0.8"/>
  <polygon points="100,115 120,125 115,155 95,150" fill="url(#grad-geometric)" opacity="0.75"/>
  <polygon points="100,115 80,125 85,155 105,150" fill="url(#grad-geometric)" opacity="0.75"/>
  
  <!-- Sentrale linjer -->
  <line x1="100" y1="75" x2="75" y2="105" stroke="url(#grad-geometric)" stroke-width="2" opacity="0.4"/>
  <line x1="100" y1="75" x2="125" y2="105" stroke="url(#grad-geometric)" stroke-width="2" opacity="0.4"/>
  <line x1="100" y1="115" x2="100" y2="75" stroke="url(#grad-geometric)" stroke-width="1.5" opacity="0.3"/>
</svg>
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Tre roterte linjer som møtes i sentrum -->
  <line x1="100" y1="20" x2="100" y2="120" stroke="url(#grad)" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <line x1="40" y1="100" x2="140" y2="100" stroke="url(#grad)" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <line x1="55" y1="45" x2="145" y2="155" stroke="url(#grad)" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Sentrale flytende punkter -->
  <circle cx="100" cy="100" r="8" fill="url(#grad)" opacity="1"/>
  <circle cx="100" cy="50" r="5" fill="url(#grad)" opacity="0.7"/>
  <circle cx="130" cy="100" r="5" fill="url(#grad)" opacity="0.7"/>
  <circle cx="75" cy="75" r="5" fill="url(#grad)" opacity="0.7"/>
</svg>
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-flat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Flat design - stabler med biler/elementer -->
  <!-- Stabel 1 - venstre -->
  <rect x="30" y="50" width="35" height="28" fill="url(#grad-flat)" opacity="1" rx="2"/>
  <rect x="30" y="82" width="35" height="28" fill="url(#grad-flat)" opacity="0.75" rx="2"/>
  <rect x="30" y="114" width="35" height="28" fill="url(#grad-flat)" opacity="0.5" rx="2"/>
  
  <!-- Stabel 2 - sentrum -->
  <rect x="80" y="40" width="40" height="32" fill="url(#grad-flat)" opacity="0.95" rx="2"/>
  <rect x="80" y="76" width="40" height="32" fill="url(#grad-flat)" opacity="0.8" rx="2"/>
  <rect x="80" y="112" width="40" height="32" fill="url(#grad-flat)" opacity="0.6" rx="2"/>
  
  <!-- Stabel 3 - høyre -->
  <rect x="135" y="50" width="35" height="28" fill="url(#grad-flat)" opacity="0.85" rx="2"/>
  <rect x="135" y="82" width="35" height="28" fill="url(#grad-flat)" opacity="0.7" rx="2"/>
  <rect x="135" y="114" width="35" height="28" fill="url(#grad-flat)" opacity="0.5" rx="2"/>
  
  <!-- Pil som viser bevegelse/sending -->
  <path d="M 100 160 L 100 175 M 95 170 L 100 175 L 105 170" 
        fill="none" stroke="url(#grad-flat)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="vinylGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="#faf7f2"/>
  
  <!-- Vinyl record - left half -->
  <clipPath id="leftHalf">
    <rect x="80" y="100" width="120" height="220"/>
  </clipPath>
  <g clip-path="url(#leftHalf)">
    <circle cx="200" cy="200" r="100" fill="#1a1a2e" stroke="#2d2d44" stroke-width="1"/>
    <circle cx="200" cy="200" r="90" fill="none" stroke="#2d2d44" stroke-width="0.5"/>
    <circle cx="200" cy="200" r="80" fill="none" stroke="#2d2d44" stroke-width="0.3"/>
    <circle cx="200" cy="200" r="70" fill="none" stroke="#2d2d44" stroke-width="0.5"/>
    <circle cx="200" cy="200" r="60" fill="none" stroke="#2d2d44" stroke-width="0.3"/>
    <circle cx="200" cy="200" r="50" fill="none" stroke="#2d2d44" stroke-width="0.5"/>
    <circle cx="200" cy="200" r="40" fill="none" stroke="#2d2d44" stroke-width="0.3"/>
    <circle cx="200" cy="200" r="30" fill="none" stroke="#333" stroke-width="0.5"/>
    <circle cx="200" cy="200" r="15" fill="#0d9488"/>
    <circle cx="200" cy="200" r="3" fill="#1a1a2e"/>
  </g>
  
  <!-- Butterfly wing - right half, formed from vinyl grooves -->
  <g transform="translate(200,200)">
    <!-- Upper wing -->
    <path d="M0,-10 Q40,-90 95,-75 Q110,-70 105,-45 Q100,-20 60,-15 Q30,-12 0,-10Z" fill="#0d9488" opacity="0.85"/>
    <path d="M0,-10 Q30,-70 70,-60 Q85,-55 80,-35 Q75,-18 45,-14 Q20,-12 0,-10Z" fill="#14b8a6" opacity="0.6"/>
    <path d="M0,-10 Q20,-45 45,-40 Q55,-37 50,-25 Q45,-16 25,-13 Q10,-11 0,-10Z" fill="#2dd4bf" opacity="0.4"/>
    
    <!-- Lower wing -->
    <path d="M0,10 Q45,85 90,80 Q105,78 100,55 Q95,30 55,18 Q25,13 0,10Z" fill="#f97316" opacity="0.85"/>
    <path d="M0,10 Q35,65 65,62 Q80,60 75,42 Q70,25 40,17 Q18,13 0,10Z" fill="#fb923c" opacity="0.6"/>
    <path d="M0,10 Q22,40 40,38 Q50,37 47,27 Q44,18 25,14 Q10,12 0,10Z" fill="#fdba74" opacity="0.4"/>
    
    <!-- Wing veins / groove lines continuing into wings -->
    <path d="M5,-15 Q50,-70 90,-60" fill="none" stroke="#0a7c72" stroke-width="0.7" opacity="0.5"/>
    <path d="M5,-20 Q55,-80 100,-65" fill="none" stroke="#0a7c72" stroke-width="0.5" opacity="0.4"/>
    <path d="M5,15 Q50,65 85,62" fill="none" stroke="#c2410c" stroke-width="0.7" opacity="0.5"/>
    <path d="M5,20 Q55,75 95,72" fill="none" stroke="#c2410c" stroke-width="0.5" opacity="0.4"/>
    
    <!-- Body line -->
    <line x1="0" y1="-15" x2="0" y2="15" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Antennae -->
    <path d="M0,-15 Q-8,-30 -5,-40" fill="none" stroke="#1a1a2e" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M0,-15 Q8,-32 12,-42" fill="none" stroke="#1a1a2e" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="-5" cy="-41" r="2" fill="#0d9488"/>
    <circle cx="12" cy="-43" r="2" fill="#f97316"/>
  </g>
  
  <!-- Subtle groove lines extending from vinyl into butterfly -->
  <circle cx="200" cy="200" r="95" fill="none" stroke="#e5e5e5" stroke-width="0.3" stroke-dasharray="2,4"/>
  <circle cx="200" cy="200" r="110" fill="none" stroke="#e5e5e5" stroke-width="0.3" stroke-dasharray="2,6"/>
  
  <!-- Text -->
  <text x="200" y="345" text-anchor="middle" font-family="'Palatino Linotype', Georgia, serif" font-size="13" fill="#1a1a2e" letter-spacing="5" opacity="0.7">VINYL METAMORPHOSIS</text>
</svg>
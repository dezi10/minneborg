<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Geometrisk versjon -->
  <rect width="400" height="400" fill="#f5f5f5"/>
  
  <!-- Ytre ramme (geometrisk) -->
  <rect x="60" y="40" width="280" height="320" stroke="#1a1a1a" stroke-width="3" fill="none" rx="5"/>
  
  <!-- Sol (geometrisk) -->
  <polygon points="240,80 258,110 240,130 222,110" fill="#ff6b35" stroke="none"/>
  <circle cx="240" cy="110" r="35" fill="none" stroke="#ff6b35" stroke-width="2"/>
  
  <!-- Palme (triangler) -->
  <rect x="110" y="120" width="8" height="60" fill="#1a1a1a"/>
  <polygon points="114,115 95,105 133,105" fill="#1a1a1a"/>
  <polygon points="114,115 92,108 136,125" fill="#1a1a1a"/>
  <polygon points="114,115 95,135 133,135" fill="#1a1a1a"/>
  
  <!-- Bølger (geometrisk) -->
  <g fill="none" stroke="#1a1a1a" stroke-width="2">
    <path d="M80,220 L120,200 L160,220 L200,190 L240,220 L280,195 L320,220"/>
    <path d="M80,320 L120,300 L160,320 L200,290 L240,320 L280,295 L320,320"/>
  </g>
  
  <!-- Strand (linje) -->
  <path d="M140,280 L200,310 L260,295" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  
  <!-- Vannlinjer (kvadrater) -->
  <rect x="205" y="260" width="8" height="8" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="235" y="270" width="8" height="8" fill="none" stroke="#1a1a1a" stroke-width="1"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Pop-art versjon (som Andy Warhol) -->
  <rect width="400" height="400" fill="#d700d7"/>
  
  <!-- Ytre ramme (pop-art bold) -->
  <path d="M60,360 V80 Q60,40 200,40 Q340,40 340,80 V360" stroke="#00ff00" stroke-width="5" fill="none"/>
  <path d="M60,360 H340" stroke="#00ff00" stroke-width="5" fill="none"/>
  
  <!-- Sol (pop-art - STOR) -->
  <circle cx="240" cy="120" r="44" fill="#00ff00"/>
  <circle cx="240" cy="120" r="40" fill="#ffff00" stroke="black" stroke-width="2"/>
  
  <!-- Palme (pop-art) -->
  <rect x="110" y="120" width="8" height="60" fill="#ff0000" stroke="black" stroke-width="1.5"/>
  <path d="M114,120 Q100,100 128,110" stroke="#ff0000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M114,120 Q98,115 130,120" stroke="#ff0000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M114,120 Q100,130 128,130" stroke="#ff0000" stroke-width="5" fill="none" stroke-linecap="round"/>
  
  <!-- Bølger (pop-art kontrastfylt) -->
  <path d="M80,220 Q160,180 200,200 Q240,220 320,180" stroke="#00ffff" stroke-width="5" fill="none"/>
  <path d="M80,320 Q160,260 200,280 Q240,300 320,260" stroke="#ffff00" stroke-width="5" fill="none"/>
  
  <!-- Strand (pop-art) -->
  <path d="M140,280 Q200,320 260,300" stroke="#00ff00" stroke-width="5" fill="none"/>
  
  <!-- Vannlinjer (pop-art) -->
  <path d="M200,260 Q210,270 220,265" stroke="#ffff00" stroke-width="3" fill="none"/>
  <path d="M230,270 Q240,280 250,275" stroke="#00ffff" stroke-width="3" fill="none"/>
  
  <!-- Pop-art signatur -->
  <text x="320" y="350" font-family="Arial Black, sans-serif" font-size="14" fill="#00ff00" font-weight="bold" opacity="0.8">
    POP
  </text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Konsept 2: "The Sound Bird" — Twitter-inspirert.
       Én eneste bold silhuett: en fugl formet av en vinylplate og 
       lydølger. Ren, ikonisk, én farge. Fuglen = frihet + reise + drøm. -->
  <rect width="400" height="400" fill="#ffffff"/>
  
  <g transform="translate(200,195)">
    <!-- Main bird body - vinyl-round belly -->
    <path d="M-20,10 
             C-60,10 -85,-15 -85,-50 
             C-85,-75 -65,-90 -40,-90
             C-20,-90 0,-80 15,-65
             C35,-80 60,-85 80,-75
             C100,-65 100,-40 85,-25
             C100,-10 95,5 80,15
             C60,30 30,35 0,35
             C-25,35 -50,30 -60,20
             Z" fill="#1a1a1a"/>
    
    <!-- Wing - sweeping upward like a DJ arm movement -->
    <path d="M-30,-20 
             C-50,-40 -70,-70 -65,-90
             C-60,-105 -40,-110 -20,-100
             C0,-90 5,-70 -5,-50
             C-10,-35 -20,-25 -30,-20Z" fill="#1a1a1a"/>
    
    <!-- Second wing layer for depth -->
    <path d="M-25,-15
             C-40,-30 -55,-55 -50,-72
             C-47,-82 -35,-85 -22,-78
             C-10,-70 -5,-55 -10,-40
             C-13,-30 -20,-22 -25,-15Z" fill="#2a2a2a"/>
    
    <!-- Vinyl grooves as body texture -->
    <circle cx="10" cy="-10" r="35" fill="none" stroke="#2a2a2a" stroke-width="0.8" opacity="0.3"/>
    <circle cx="10" cy="-10" r="28" fill="none" stroke="#2a2a2a" stroke-width="0.6" opacity="0.3"/>
    <circle cx="10" cy="-10" r="21" fill="none" stroke="#2a2a2a" stroke-width="0.8" opacity="0.3"/>
    <circle cx="10" cy="-10" r="14" fill="none" stroke="#2a2a2a" stroke-width="0.6" opacity="0.3"/>
    <!-- Center label -->
    <circle cx="10" cy="-10" r="7" fill="#2d2d2d"/>
    <circle cx="10" cy="-10" r="2" fill="#1a1a1a"/>
    
    <!-- Eye -->
    <circle cx="45" cy="-40" r="4" fill="#ffffff"/>
    <circle cx="46" cy="-41" r="1.5" fill="#1a1a1a"/>
    
    <!-- Beak -->
    <path d="M85,-25 L100,-30 L88,-20Z" fill="#1a1a1a"/>
    
    <!-- Tail feathers - like sound wave peaks -->
    <path d="M-60,15 C-80,10 -100,0 -105,-15" stroke="#1a1a1a" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M-55,22 C-75,22 -95,15 -100,5" stroke="#1a1a1a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M-50,28 C-68,30 -82,28 -90,20" stroke="#1a1a1a" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
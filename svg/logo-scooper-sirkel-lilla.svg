<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Kreativ scooper-sirkel-logo med lilla farge for visdom og erfaring -->
  <rect width="400" height="400" fill="#1c1917"/>
  <g>
    <!-- 6 scoopere i sirkel, lilla nyanser -->
    <g transform="rotate(0 200 200)">
      <ellipse cx="200" cy="120" rx="36" ry="18" fill="#a18cd1"/>
      <rect x="192" y="138" width="16" height="40" rx="8" fill="#a18cd1"/>
    </g>
    <g transform="rotate(60 200 200)">
      <ellipse cx="200" cy="120" rx="36" ry="18" fill="#b084cc" opacity="0.85"/>
      <rect x="192" y="138" width="16" height="40" rx="8" fill="#b084cc" opacity="0.85"/>
    </g>
    <g transform="rotate(120 200 200)">
      <ellipse cx="200" cy="120" rx="36" ry="18" fill="#8f5fd2" opacity="0.7"/>
      <rect x="192" y="138" width="16" height="40" rx="8" fill="#8f5fd2" opacity="0.7"/>
    </g>
    <g transform="rotate(180 200 200)">
      <ellipse cx="200" cy="120" rx="36" ry="18" fill="#6c3fa6" opacity="0.55"/>
      <rect x="192" y="138" width="16" height="40" rx="8" fill="#6c3fa6" opacity="0.55"/>
    </g>
    <g transform="rotate(240 200 200)">
      <ellipse cx="200" cy="120" rx="36" ry="18" fill="#a18cd1" opacity="0.4"/>
      <rect x="192" y="138" width="16" height="40" rx="8" fill="#a18cd1" opacity="0.4"/>
    </g>
    <g transform="rotate(300 200 200)">
      <ellipse cx="200" cy="120" rx="36" ry="18" fill="#b084cc" opacity="0.25"/>
      <rect x="192" y="138" width="16" height="40" rx="8" fill="#b084cc" opacity="0.25"/>
    </g>
    <!-- Midtpunkt: abstrakt scoop, dyp lilla -->
    <ellipse cx="200" cy="200" rx="28" ry="28" fill="#6c3fa6"/>
    <!-- Sirkelformet outline for ekstra effekt -->
    <circle cx="200" cy="200" r="120" fill="none" stroke="#a18cd1" stroke-width="6" opacity="0.18"/>
  </g>
</svg>
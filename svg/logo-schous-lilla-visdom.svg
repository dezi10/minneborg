<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Logo: Schous bryggeri i rammen, lilla visdom, ingen sol -->
  <rect width="400" height="400" fill="#bfe6e6"/>
  <!-- Ytre ramme med buet topp -->
  <path d="M40,360 V60 Q40,40 60,40 H340 Q360,40 360,60 V360" stroke="#222" stroke-width="4" fill="none"/>
  <path d="M40,360 H360" stroke="#222" stroke-width="4" fill="none"/>
  <path d="M40,60 Q40,20 200,20 Q360,20 360,60" stroke="#222" stroke-width="4" fill="none"/>
  <!-- Schous bryggeri: stilisert silhuett, lilla -->
  <g>
    <!-- Hovedbygg -->
    <rect x="120" y="180" width="160" height="60" rx="8" fill="#a18cd1" stroke="#222" stroke-width="3"/>
    <!-- Tårn -->
    <rect x="180" y="140" width="40" height="60" rx="6" fill="#8f5fd2" stroke="#222" stroke-width="3"/>
    <!-- Tak på tårn -->
    <polygon points="180,140 200,110 220,140" fill="#6c3fa6" stroke="#222" stroke-width="2"/>
    <!-- Vinduer -->
    <rect x="130" y="200" width="16" height="24" rx="3" fill="#b084cc"/>
    <rect x="154" y="200" width="16" height="24" rx="3" fill="#b084cc"/>
    <rect x="178" y="200" width="16" height="24" rx="3" fill="#b084cc"/>
    <rect x="202" y="200" width="16" height="24" rx="3" fill="#b084cc"/>
    <rect x="226" y="200" width="16" height="24" rx="3" fill="#b084cc"/>
    <rect x="250" y="200" width="16" height="24" rx="3" fill="#b084cc"/>
    <!-- Dør -->
    <rect x="200" y="230" width="20" height="30" rx="4" fill="#6c3fa6"/>
  </g>
  <!-- Visdomssymbol: stilisert ugle i lilla, på toppen av tårnet -->
  <g>
    <ellipse cx="200" cy="120" rx="12" ry="8" fill="#a18cd1" stroke="#222" stroke-width="2"/>
    <circle cx="194" cy="120" r="2.5" fill="#222"/>
    <circle cx="206" cy="120" r="2.5" fill="#222"/>
    <path d="M192,124 Q200,128 208,124" stroke="#222" stroke-width="2" fill="none"/>
  </g>
</svg>
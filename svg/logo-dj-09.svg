<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Konsept 9: "The Dreamer's Hand" — Poetisk silhuett.
       En hånd strekker seg opp fra bunnen, og fra fingrene 
       stiger det opp lydbølger som blir til fugler/stjerner.
       Drøm + aspirasjon + musikk. Ren silhuett. -->
  <rect width="400" height="400" fill="#1c1917"/>
  
  <g transform="translate(200,380)">
    <!-- Hand reaching upward — simplified, expressive -->
    <!-- Palm -->
    <path d="M-25,0 L-30,-40 C-30,-50 -25,-55 -20,-55 L-20,-90 C-20,-98 -12,-98 -12,-90 L-12,-55
             L-8,-55 L-8,-100 C-8,-108 0,-108 0,-100 L0,-55
             L5,-55 L5,-95 C5,-103 13,-103 13,-95 L13,-55
             L18,-55 L18,-80 C18,-88 26,-88 26,-80 L26,-50
             C28,-40 30,-30 28,-15 L25,0 Z" fill="#e8dcc8"/>
    
    <!-- Sound waves / musical energy rising from fingertips -->
    <!-- From index finger -->
    <path d="M-16,-98 C-20,-115 -15,-130 -10,-140" fill="none" stroke="#e8dcc8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M-20,-98 C-25,-118 -22,-138 -18,-155" fill="none" stroke="#e8dcc8" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
    
    <!-- From middle finger -->
    <path d="M-4,-108 C-4,-125 0,-140 2,-155" fill="none" stroke="#e8dcc8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M-8,-105 C-10,-128 -5,-150 -2,-170" fill="none" stroke="#e8dcc8" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
    <path d="M1,-108 C5,-130 8,-155 6,-180" fill="none" stroke="#e8dcc8" stroke-width="0.8" stroke-linecap="round" opacity="0.3"/>
    
    <!-- From ring finger -->
    <path d="M9,-103 C12,-118 15,-135 18,-148" fill="none" stroke="#e8dcc8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M13,-100 C18,-120 22,-145 20,-165" fill="none" stroke="#e8dcc8" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
    
    <!-- From pinky -->
    <path d="M22,-88 C28,-100 30,-115 28,-128" fill="none" stroke="#e8dcc8" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Transforming into abstract birds at the top -->
    <!-- Bird 1 -->
    <path d="M-12,-155 C-18,-162 -25,-160 -30,-155" fill="none" stroke="#e8dcc8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M-12,-155 C-8,-162 -2,-160 4,-155" fill="none" stroke="#e8dcc8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Bird 2 -->
    <path d="M2,-180 C-3,-186 -8,-185 -12,-181" fill="none" stroke="#e8dcc8" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
    <path d="M2,-180 C6,-186 10,-185 14,-181" fill="none" stroke="#e8dcc8" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
    
    <!-- Bird 3 — smallest, highest -->
    <path d="M18,-165 C15,-169 12,-168 10,-166" fill="none" stroke="#e8dcc8" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
    <path d="M18,-165 C20,-169 23,-168 25,-166" fill="none" stroke="#e8dcc8" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
    
    <!-- Stars scattered -->
    <circle cx="-30" cy="-170" r="1.5" fill="#e8dcc8" opacity="0.3"/>
    <circle cx="30" cy="-180" r="1" fill="#e8dcc8" opacity="0.25"/>
    <circle cx="-5" cy="-200" r="1.5" fill="#e8dcc8" opacity="0.35"/>
    <circle cx="15" cy="-195" r="1" fill="#e8dcc8" opacity="0.2"/>
    <circle cx="-20" cy="-190" r="0.8" fill="#e8dcc8" opacity="0.2"/>
  </g>
</svg>
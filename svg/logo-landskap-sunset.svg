<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sunset-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff7e5f;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#feb47b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#feca57;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Solnedgangsversjon -->
  <rect width="400" height="400" fill="url(#sunset-gradient)"/>
  
  <!-- Ytre ramme -->
  <path d="M60,360 V80 Q60,40 200,40 Q340,40 340,80 V360" stroke="#d9520a" stroke-width="4" fill="none" opacity="0.8"/>
  <path d="M60,360 H340" stroke="#d9520a" stroke-width="4" fill="none" opacity="0.8"/>
  
  <!-- Sol (silhuett) -->
  <circle cx="240" cy="120" r="44" fill="#ff4500" opacity="0.9"/>
  
  <!-- Palme silhuett -->
  <rect x="110" y="120" width="8" height="60" rx="4" fill="#333" opacity="0.8"/>
  <path d="M114,120 Q100,100 128,110" stroke="#333" stroke-width="4" fill="none" opacity="0.8" stroke-linecap="round"/>
  <path d="M114,120 Q98,115 130,120" stroke="#333" stroke-width="4" fill="none" opacity="0.8" stroke-linecap="round"/>
  <path d="M114,120 Q100,130 128,130" stroke="#333" stroke-width="4" fill="none" opacity="0.8" stroke-linecap="round"/>
  
  <!-- Bølger silhuett -->
  <path d="M80,220 Q160,180 200,200 Q240,220 320,180" stroke="#c41e3a" stroke-width="4" fill="none" opacity="0.7"/>
  <path d="M80,320 Q160,260 200,280 Q240,300 320,260" stroke="#8b0000" stroke-width="4" fill="none" opacity="0.7"/>
  
  <!-- Strand silhuett -->
  <path d="M140,280 Q200,320 260,300" stroke="#8b4513" stroke-width="4" fill="none" opacity="0.8"/>
  
  <!-- Vannlinjer -->
  <path d="M200,260 Q210,270 220,265" stroke="#d9520a" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M230,270 Q240,280 250,275" stroke="#d9520a" stroke-width="3" fill="none" opacity="0.6"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Logo: Kun geometriske former, ingen symboler -->
  <rect width="400" height="400" fill="#1c1917"/>
  <!-- Sirkel -->
  <circle cx="120" cy="120" r="60" fill="#e8dcc8"/>
  <!-- Rektangel -->
  <rect x="220" y="80" width="100" height="120" rx="20" fill="#e8dcc8"/>
  <!-- Trekant -->
  <polygon points="80,320 200,200 320,320" fill="#e8dcc8"/>
  <!-- Overlappende former for ekstra effekt -->
  <ellipse cx="200" cy="320" rx="60" ry="30" fill="#e8dcc8" opacity="0.7"/>
  <rect x="60" y="220" width="80" height="40" rx="10" fill="#e8dcc8" opacity="0.5"/>
</svg>
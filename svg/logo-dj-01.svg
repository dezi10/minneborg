<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Konsept 1: "Moonlight DJ" — DreamWorks-inspirert silhuett.
       En figur med hodetelefoner sitter på kanten av en vinylplate
       formet som en halvmåne, med en tonearm som fiskestang mot stjernene. -->
  <rect width="400" height="400" fill="#0c1445"/>
  
  <!-- Vinyl crescent moon -->
  <clipPath id="crescent">
    <path d="M200,80 A120,120 0 1,1 200,320 A90,90 0 1,0 200,80Z"/>
  </clipPath>
  <path d="M200,80 A120,120 0 1,1 200,320 A90,90 0 1,0 200,80Z" fill="#e8dcc8"/>
  <!-- Vinyl grooves on the crescent -->
  <g clip-path="url(#crescent)" opacity="0.15">
    <circle cx="175" cy="200" r="115" fill="none" stroke="#0c1445" stroke-width="1"/>
    <circle cx="175" cy="200" r="105" fill="none" stroke="#0c1445" stroke-width="0.7"/>
    <circle cx="175" cy="200" r="95" fill="none" stroke="#0c1445" stroke-width="1"/>
    <circle cx="175" cy="200" r="85" fill="none" stroke="#0c1445" stroke-width="0.7"/>
    <circle cx="175" cy="200" r="75" fill="none" stroke="#0c1445" stroke-width="1"/>
    <circle cx="175" cy="200" r="65" fill="none" stroke="#0c1445" stroke-width="0.7"/>
    <circle cx="175" cy="200" r="55" fill="none" stroke="#0c1445" stroke-width="1"/>
    <circle cx="175" cy="200" r="45" fill="none" stroke="#0c1445" stroke-width="0.7"/>
  </g>
  
  <!-- Sitting figure silhouette on the crescent edge -->
  <g fill="#0c1445">
    <!-- Head -->
    <circle cx="222" cy="118" r="14"/>
    <!-- Headphones -->
    <path d="M208,114 A16,16 0 0,1 236,114" fill="none" stroke="#0c1445" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="205" y="112" width="5" height="10" rx="2"/>
    <rect x="234" y="112" width="5" height="10" rx="2"/>
    <!-- Body - sitting posture -->
    <path d="M222,132 Q220,150 215,165 Q210,175 200,182"/>
    <path d="M222,132 C224,145 226,155 230,162 C234,170 240,173 245,170" fill="#0c1445" stroke="#0c1445" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Torso -->
    <ellipse cx="222" cy="148" rx="10" ry="16"/>
    <!-- Legs -->
    <path d="M215,162 Q208,180 195,192" stroke="#0c1445" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M228,160 Q240,175 248,172" stroke="#0c1445" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Arm reaching up - holding tonearm -->
    <path d="M230,140 Q245,125 255,108" stroke="#0c1445" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Tonearm as "fishing line" reaching to stars -->
  <line x1="255" y1="108" x2="290" y2="70" stroke="#e8dcc8" stroke-width="1.5" opacity="0.7"/>
  <line x1="290" y1="70" x2="290" y2="72" stroke="#e8dcc8" stroke-width="1" opacity="0.5" stroke-dasharray="2,3"/>
  
  <!-- Stars -->
  <circle cx="290" cy="65" r="3" fill="#e8dcc8"/>
  <circle cx="310" cy="95" r="1.5" fill="#e8dcc8" opacity="0.6"/>
  <circle cx="275" cy="88" r="1" fill="#e8dcc8" opacity="0.4"/>
  <circle cx="320" cy="130" r="1.5" fill="#e8dcc8" opacity="0.5"/>
  <circle cx="150" cy="100" r="1" fill="#e8dcc8" opacity="0.3"/>
  <circle cx="130" cy="140" r="1.5" fill="#e8dcc8" opacity="0.4"/>
  <circle cx="300" cy="160" r="1" fill="#e8dcc8" opacity="0.3"/>
</svg>
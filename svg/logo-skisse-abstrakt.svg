<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Logo basert på skisse: rektangel, stjerner, buer, linjer -->
  <rect width="400" height="400" fill="#f5f3e7"/>
  <!-- Rektangel -->
  <rect x="80" y="160" width="240" height="120" rx="12" fill="none" stroke="#6c3fa6" stroke-width="6"/>
  <!-- Venstre bue -->
  <path d="M80,160 Q60,120 120,80" stroke="#6c3fa6" stroke-width="4" fill="none"/>
  <!-- Høyre bue -->
  <path d="M320,160 Q360,120 280,80" stroke="#6c3fa6" stroke-width="4" fill="none"/>
  <!-- Midt bue -->
  <path d="M200,160 Q200,100 200,80" stroke="#6c3fa6" stroke-width="4" fill="none"/>
  <!-- Stjerner -->
  <polygon points="120,110 126,124 140,124 128,132 132,146 120,136 108,146 112,132 100,124 114,124" fill="#6c3fa6"/>
  <polygon points="280,110 286,124 300,124 288,132 292,146 280,136 268,146 272,132 260,124 274,124" fill="#6c3fa6"/>
  <!-- Små linjer -->
  <path d="M160,100 L170,120" stroke="#6c3fa6" stroke-width="3"/>
  <path d="M240,100 L230,120" stroke="#6c3fa6" stroke-width="3"/>
</svg>
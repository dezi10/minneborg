<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Radikalt ny logo: Iskrem som eksploderer i former, farger og bevegelse -->
  <rect width="400" height="400" fill="#1c1917"/>
  <g transform="translate(200,220)">
    <!-- Iskremkule, men med uvanlig form -->
    <ellipse cx="0" cy="0" rx="32" ry="28" fill="#e8dcc8"/>
    <!-- Vaffel, men brutt opp i geometriske fragmenter -->
    <polygon points="-24,28 -8,90 0,60 8,90 24,28" fill="#e8dcc8"/>
    <!-- Eksploderende former: fargerike stråler og sirkler -->
    <g>
      <ellipse cx="-50" cy="-30" rx="12" ry="6" fill="#e8dcc8" opacity="0.7"/>
      <ellipse cx="50" cy="-30" rx="12" ry="6" fill="#e8dcc8" opacity="0.7"/>
      <ellipse cx="-40" cy="40" rx="8" ry="4" fill="#e8dcc8" opacity="0.5"/>
      <ellipse cx="40" cy="40" rx="8" ry="4" fill="#e8dcc8" opacity="0.5"/>
      <ellipse cx="0" cy="-60" rx="16" ry="8" fill="#e8dcc8" opacity="0.4"/>
    </g>
    <!-- Uvanlig bevegelse: spiral som går ut fra iskremkule -->
    <path d="M0,0 Q10,-20 20,-40 Q30,-60 0,-80 Q-30,-60 -20,-40 Q-10,-20 0,0" stroke="#e8dcc8" stroke-width="4" fill="none"/>
    <!-- Abstrakt figur: en liten "person" som hopper ut av iskremen -->
    <circle cx="0" cy="-90" r="10" fill="#e8dcc8"/>
    <rect x="-4" y="-80" width="8" height="18" rx="4" fill="#e8dcc8"/>
    <ellipse cx="0" cy="-62" rx="6" ry="3" fill="#e8dcc8"/>
  </g>
</svg>
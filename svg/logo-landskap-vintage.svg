<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Vintage (sepia/brunt) versjon -->
  <rect width="400" height="400" fill="#d7ccc8"/>
  
  <!-- Ytre ramme (vintage) -->
  <path d="M60,360 V80 Q60,40 200,40 Q340,40 340,80 V360" stroke="#5d4e37" stroke-width="3.5" fill="none" opacity="0.8"/>
  <path d="M60,360 H340" stroke="#5d4e37" stroke-width="3.5" fill="none" opacity="0.8"/>
  
  <!-- Vintage tekstur bakgrunn -->
  <rect width="400" height="400" fill="#c7bfb5" opacity="0.3"/>
  
  <!-- Sol (vintage) -->
  <circle cx="240" cy="120" r="44" fill="#b8860b" opacity="0.9"/>
  <circle cx="240" cy="120" r="40" fill="#daa520" opacity="0.6"/>
  
  <!-- Palme (vintage sepia) -->
  <rect x="110" y="120" width="8" height="60" fill="#6b4423"/>
  <path d="M114,120 Q100,100 128,110" stroke="#6b4423" stroke-width="4.5" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M114,120 Q98,115 130,120" stroke="#6b4423" stroke-width="4.5" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M114,120 Q100,130 128,130" stroke="#6b4423" stroke-width="4.5" fill="none" stroke-linecap="round" opacity="0.85"/>
  
  <!-- Bølger (vintage) -->
  <path d="M80,220 Q160,180 200,200 Q240,220 320,180" stroke="#704214" stroke-width="3.5" fill="none" opacity="0.8"/>
  <path d="M80,320 Q160,260 200,280 Q240,300 320,260" stroke="#8b6f47" stroke-width="3.5" fill="none" opacity="0.7"/>
  
  <!-- Strand (vintage) -->
  <path d="M140,280 Q200,320 260,300" stroke="#8b7355" stroke-width="3.5" fill="none" opacity="0.85"/>
  
  <!-- Vannlinjer (vintage) -->
  <path d="M200,260 Q210,270 220,265" stroke="#704214" stroke-width="2.5" fill="none" opacity="0.6"/>
  <path d="M230,270 Q240,280 250,275" stroke="#704214" stroke-width="2.5" fill="none" opacity="0.6"/>
  
  <!-- Vintage effekt (Vignette) -->
  <ellipse cx="200" cy="200" rx="180" ry="190" fill="black" opacity="0.05"/>
</svg>
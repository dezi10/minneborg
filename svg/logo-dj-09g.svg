<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- 09g: Radikal forenkling. 
       Én enkelt bølge som BLIR til én fugl.
       Hele logoen er bare én sammenhengende linje/form.
       Inspirert av Saul Bass' minimalisme. -->
  <rect width="400" height="400" fill="#1c1917"/>
  
  <g transform="translate(200,200)">
    
    <!-- Én form: lydbølge som morfer til fugl -->
    <!-- Starter som bølge nede, ender som fugl oppe -->
    <path d="
      M-80,80
      C-60,60 -20,10 0,-20
      C8,-33 12,-45 8,-55
      C4,-62 -5,-68 -18,-72
      C-30,-76 -50,-80 -70,-76
      C-58,-72 -42,-64 -28,-60
      C-14,-56 -4,-50 0,-40
      C4,-50 14,-56 28,-60
      C42,-64 58,-72 70,-76
      C50,-80 30,-76 18,-72
      C5,-68 -4,-62 -8,-55
      C-12,-45 -8,-33 0,-20
      C20,10 60,60 80,80
    " fill="none" stroke="#e8dcc8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Kilde-prikk nede -->
    <circle cx="0" cy="110" r="8" fill="#e8dcc8"/>
    
    <!-- Oppadgående strek fra punkt til bølge/fugl -->
    <path d="M0,102 L0,-20" fill="none" stroke="#e8dcc8" stroke-width="8" stroke-linecap="round"/>
    
  </g>
</svg>
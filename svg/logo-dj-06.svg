<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Konsept 6: "Headphones Horizon" — Minimalt, poetisk.
       Et par hodetelefoner der bøylen danner en horisont/soloppgang.
       Øreputene hviler på "bakken". Enkel og drømmende. -->
  <rect width="400" height="400" fill="#ffffff"/>
  
  <g transform="translate(200,210)" fill="none" stroke="#1a1a1a">
    <!-- Horizon line -->
    <line x1="-170" y1="30" x2="170" y2="30" stroke-width="1.5"/>
    
    <!-- Headphone band = arc rising from horizon like sunrise -->
    <path d="M-65,30 C-65,-50 -40,-90 0,-95 C40,-90 65,-50 65,30" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Left ear cup — abstract rectangle with rounded corners -->
    <rect x="-78" y="10" width="26" height="40" rx="6" fill="#1a1a1a" stroke="none"/>
    
    <!-- Right ear cup -->
    <rect x="52" y="10" width="26" height="40" rx="6" fill="#1a1a1a" stroke="none"/>
    
    <!-- Sun/vinyl rising above the headphone arc -->
    <circle cx="0" cy="-95" r="18" stroke-width="2.5" fill="#ffffff"/>
    <!-- Grooves on the sun-vinyl -->
    <circle cx="0" cy="-95" r="13" stroke-width="0.8" opacity="0.3"/>
    <circle cx="0" cy="-95" r="8" stroke-width="0.5" opacity="0.3"/>
    <circle cx="0" cy="-95" r="3" fill="#1a1a1a" stroke="none"/>
    
    <!-- Rays emanating — subtle, like light or sound -->
    <line x1="0" y1="-118" x2="0" y2="-128" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <line x1="15" y1="-113" x2="20" y2="-122" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
    <line x1="-15" y1="-113" x2="-20" y2="-122" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
    <line x1="27" y1="-104" x2="35" y2="-110" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
    <line x1="-27" y1="-104" x2="-35" y2="-110" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Servitør-logo: En hånd som bærer et fat med en iskrem på toppen -->
  <rect width="400" height="400" fill="#1c1917"/>
  <g transform="translate(200,220)">
    <!-- Hånd -->
    <path d="M-60,60 Q-40,40 0,40 Q40,40 60,60 Q40,70 0,70 Q-40,70 -60,60Z" fill="#e8dcc8"/>
    <!-- Underarm -->
    <rect x="-15" y="70" width="30" height="40" rx="10" fill="#e8dcc8"/>
    <!-- Fat -->
    <ellipse cx="0" cy="30" rx="60" ry="18" fill="#e8dcc8"/>
    <!-- Iskrem-kule -->
    <circle cx="0" cy="10" r="22" fill="#e8dcc8"/>
    <!-- Iskrem-topp (sjokolade) -->
    <path d="M-12,0 Q0,-12 12,0 Q0,8 -12,0Z" fill="#1c1917"/>
    <!-- Vaffelkjeks -->
    <rect x="-8" y="-22" width="16" height="12" rx="4" fill="#e8dcc8" stroke="#1c1917" stroke-width="2"/>
  </g>
</svg>
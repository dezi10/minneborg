<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Konsept 5: "Vinyl Compass" — Én ikonisk form.
       En vinylplate der groovene danner et kompassrose-mønster.
       Tonearm = kompassnål. Musikk + reise i én symbol. -->
  <rect width="400" height="400" fill="#f8f5f0"/>
  
  <g transform="translate(200,195)">
    <!-- Outer vinyl ring -->
    <circle cx="0" cy="0" r="120" fill="#1a1a1a"/>
    <circle cx="0" cy="0" r="115" fill="none" stroke="#252525" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="108" fill="none" stroke="#252525" stroke-width="0.3"/>
    <circle cx="0" cy="0" r="101" fill="none" stroke="#252525" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="94" fill="none" stroke="#252525" stroke-width="0.3"/>
    <circle cx="0" cy="0" r="87" fill="none" stroke="#252525" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#252525" stroke-width="0.3"/>
    <circle cx="0" cy="0" r="73" fill="none" stroke="#252525" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="66" fill="none" stroke="#252525" stroke-width="0.3"/>
    <circle cx="0" cy="0" r="59" fill="none" stroke="#252525" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="52" fill="none" stroke="#252525" stroke-width="0.3"/>
    
    <!-- Center label area -->
    <circle cx="0" cy="0" r="42" fill="#f8f5f0"/>
    
    <!-- Compass rose inside label — N/S/E/W formed by clean geometric shapes -->
    <!-- North pointer — sharp triangle pointing up -->
    <polygon points="0,-38 -8,-5 0,-12 8,-5" fill="#1a1a1a"/>
    <!-- South pointer -->
    <polygon points="0,38 -8,5 0,12 8,5" fill="#1a1a1a" opacity="0.35"/>
    <!-- East pointer -->
    <polygon points="38,0 5,-8 12,0 5,8" fill="#1a1a1a" opacity="0.35"/>
    <!-- West pointer -->
    <polygon points="-38,0 -5,-8 -12,0 -5,8" fill="#1a1a1a" opacity="0.35"/>
    
    <!-- Diagonal accent lines -->
    <line x1="-25" y1="-25" x2="-10" y2="-10" stroke="#1a1a1a" stroke-width="1" opacity="0.2"/>
    <line x1="25" y1="-25" x2="10" y2="-10" stroke="#1a1a1a" stroke-width="1" opacity="0.2"/>
    <line x1="-25" y1="25" x2="-10" y2="10" stroke="#1a1a1a" stroke-width="1" opacity="0.2"/>
    <line x1="25" y1="25" x2="10" y2="10" stroke="#1a1a1a" stroke-width="1" opacity="0.2"/>
    
    <!-- Center spindle -->
    <circle cx="0" cy="0" r="3" fill="#1a1a1a"/>
    
    <!-- Tonearm as extended compass needle — extends beyond the record -->
    <line x1="0" y1="0" x2="80" y2="-95" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Headshell -->
    <line x1="80" y1="-95" x2="90" y2="-108" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Pivot point -->
    <circle cx="0" cy="0" r="5" fill="#1a1a1a" stroke="#f8f5f0" stroke-width="1.5"/>
  </g>
</svg>
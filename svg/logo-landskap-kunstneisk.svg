<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Kunstneisk versjon (impressjonistisk) -->
  <rect width="400" height="400" fill="transparent"/>
  
  <!-- Himmel (utydelige strøk) -->
  <ellipse cx="200" cy="100" rx="120" ry="80" fill="#87ceeb" opacity="0.6"/>
  
  <!-- Ytre ramme (kunstneisk) -->
  <path d="M60,360 V80 Q60,40 200,40 Q340,40 340,80 V360" stroke="#1a1a1a" stroke-width="4.5" fill="none"/>
  <path d="M60,360 H340" stroke="#1a1a1a" stroke-width="4.5" fill="none"/>
  
  <!-- Sol (kunstneisk - organisk form) -->
  <circle cx="240" cy="120" r="55" fill="#ffb347" opacity="0.85"/>
  <circle cx="240" cy="120" r="50" fill="#ffc857" opacity="0.6"/>
  
  <!-- Palme (kunstneisk strøk) -->
  <path d="M114,120 Q110,100 118,115 Q112,135 114,180" stroke="#2d5016" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M114,120 Q95,95 130,108" stroke="#3d6b1f" stroke-width="5.5" fill="none" stroke-linecap="round"/>
  <path d="M114,120 Q90,110 135,125" stroke="#2d5016" stroke-width="5.5" fill="none" stroke-linecap="round"/>
  <path d="M114,120 Q95,135 130,145" stroke="#3d6b1f" stroke-width="5.5" fill="none" stroke-linecap="round"/>
  
  <!-- Bølger (kunstneisk) -->
  <path d="M80,220 Q160,180 200,200 Q240,220 320,180" stroke="#0096d6" stroke-width="5" fill="none" opacity="0.8"/>
  <path d="M80,240 Q160,200 200,220 Q240,240 320,200" stroke="#00b4d8" stroke-width="4" fill="none" opacity="0.6"/>
  <path d="M80,320 Q160,260 200,280 Q240,300 320,260" stroke="#0096d6" stroke-width="5" fill="none" opacity="0.7"/>
  
  <!-- Strand (kunstneisk) -->
  <path d="M140,280 Q200,320 260,300" stroke="#cd853f" stroke-width="5" fill="none" opacity="0.8"/>
  <path d="M135,290 Q200,330 265,305" stroke="#daa520" stroke-width="4" fill="none" opacity="0.5"/>
  
  <!-- Vannlinjer (kunstneisk) -->
  <path d="M200,260 Q212,270 222,264" stroke="#0080b0" stroke-width="3.5" fill="none" opacity="0.6"/>
  <path d="M230,268 Q242,278 252,273" stroke="#0080b0" stroke-width="3.5" fill="none" opacity="0.5"/>
</svg>
<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyber-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyber-water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3d60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#05192d;stop-opacity:1" />
    </linearGradient>
    <filter id="cyber-glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="data-stream">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
    </filter>
  </defs>
  
  <!-- Cyberpunk himmel -->
  <rect width="800" height="350" fill="url(#cyber-sky)"/>
  
  <!-- Digitale fjell (wireframe-stil) -->
  <polygon points="0,350 150,150 300,350" fill="none" stroke="#00ff00" stroke-width="2" opacity="0.6"/>
  <polygon points="250,350 450,80 650,350" fill="none" stroke="#0099ff" stroke-width="2" opacity="0.5"/>
  <polygon points="600,350 750,180 800,350" fill="none" stroke="#ff00ff" stroke-width="2" opacity="0.4"/>
  
  <!-- Fylling av fjell med digital farge -->
  <polygon points="0,350 150,150 300,350" fill="#00ff00" opacity="0.1"/>
  <polygon points="250,350 450,80 650,350" fill="#0099ff" opacity="0.1"/>
  <polygon points="600,350 750,180 800,350" fill="#ff00ff" opacity="0.08"/>
  
  <!-- Digitale partikler i luft -->
  <circle cx="100" cy="100" r="2" fill="#00ff00" opacity="0.7" filter="url(#cyber-glow)"/>
  <circle cx="300" cy="150" r="1.5" fill="#0099ff" opacity="0.6"/>
  <circle cx="500" cy="80" r="2" fill="#ff00ff" opacity="0.5" filter="url(#cyber-glow)"/>
  <circle cx="700" cy="120" r="1.5" fill="#00ffff" opacity="0.6"/>
  
  <!-- Binær kode i himmel -->
  <text x="50" y="60" font-family="monospace" font-size="12" fill="#0099ff" opacity="0.4">1001011001</text>
  <text x="600" y="200" font-family="monospace" font-size="10" fill="#00ff00" opacity="0.3">110101</text>
  
  <!-- Vatn -->
  <rect y="350" width="800" height="250" fill="url(#cyber-water)"/>
  
  <!-- Digitale bølger (dataflyt) -->
  <path d="M 0 380 Q 100 360 200 380 T 400 380 T 600 380 T 800 380" 
        fill="none" stroke="#00ffff" stroke-width="2" opacity="0.7" filter="url(#cyber-glow)"/>
  <path d="M 0 420 Q 150 400 300 420 T 600 420 T 800 420" 
        fill="none" stroke="#00ff00" stroke-width="1.5" opacity="0.5" filter="url(#cyber-glow)"/>
  
  <!-- Datastrømmer (partikler) -->
  <circle cx="120" cy="400" r="1" fill="#00ffff" opacity="0.8" filter="url(#cyber-glow)"/>
  <circle cx="280" cy="420" r="1" fill="#00ff00" opacity="0.7"/>
  <circle cx="450" cy="410" r="1" fill="#0099ff" opacity="0.6" filter="url(#cyber-glow)"/>
  <circle cx="620" cy="430" r="1" fill="#00ffff" opacity="0.7"/>
  
  <!-- Mann (cyberpunk stil) -->
  <!-- Kropp -->
  <rect x="405" y="380" width="30" height="35" fill="#0099ff" opacity="0.8" stroke="#00ff00" stroke-width="1.5" filter="url(#cyber-glow)"/>
  
  <!-- Hode -->
  <circle cx="420" cy="355" r="16" fill="#0099ff" opacity="0.8" stroke="#00ffff" stroke-width="1.5" filter="url(#cyber-glow)"/>
  
  <!-- Hår/Antenne -->
  <line x1="410" y1="340" x2="405" y2="320" stroke="#ff00ff" stroke-width="2" filter="url(#cyber-glow)"/>
  <line x1="430" y1="340" x2="435" y2="320" stroke="#ff00ff" stroke-width="2" filter="url(#cyber-glow)"/>
  
  <!-- Øyne (digitale) -->
  <rect x="412" y="350" width="4" height="4" fill="#00ff00" filter="url(#cyber-glow)"/>
  <rect x="424" y="350" width="4" height="4" fill="#00ff00" filter="url(#cyber-glow)"/>
  <rect x="413" y="351" width="2" height="2" fill="#000"/>
  <rect x="425" y="351" width="2" height="2" fill="#000"/>
  
  <!-- Arm (fiskestang) -->
  <line x1="405" y1="390" x2="280" y2="300" stroke="#0099ff" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  <circle cx="280" cy="300" r="5" fill="#00ffff" filter="url(#cyber-glow)"/>
  
  <!-- Arm (høyre) -->
  <line x1="435" y1="390" x2="500" y2="420" stroke="#0099ff" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Ben -->
  <line x1="412" y1="415" x2="408" y2="480" stroke="#0099ff" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <line x1="428" y1="415" x2="432" y2="480" stroke="#0099ff" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Fiskestang (glødende) -->
  <line x1="280" y1="300" x2="140" y2="480" stroke="#00ff00" stroke-width="4" stroke-linecap="round" opacity="0.9" filter="url(#cyber-glow)"/>
  
  <!-- Fiskesnor (datastrøm) -->
  <path d="M 140 480 Q 110 510 100 545" 
        fill="none" stroke="#00ffff" stroke-width="2" opacity="0.8" stroke-dasharray="5,3" filter="url(#cyber-glow)"/>
  
  <!-- Fisk (cyber) -->
  <ellipse cx="95" cy="555" rx="7" ry="5" fill="#ff00ff" opacity="0.9" stroke="#00ffff" stroke-width="1" filter="url(#cyber-glow)"/>
  <polygon points="95,555 105,553 107,557" fill="#ff00ff" opacity="0.9" filter="url(#cyber-glow)"/>
  
  <!-- HUD text -->
  <text x="420" y="570" font-family="monospace" font-size="14" text-anchor="middle" fill="#00ff00" opacity="0.6" filter="url(#data-stream)">
    &lt;/hacker&gt;
  </text>
</svg>
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Hexagonal honeycomb pattern - geometrisk mosaikkfølelse -->
  <!-- Øverste rad -->
  <polygon points="50,30 70,22 90,30 85,45 65,45" fill="url(#grad)" opacity="0.8"/>
  <polygon points="100,30 120,22 140,30 135,45 115,45" fill="url(#grad)" opacity="0.7"/>
  
  <!-- Annen rad -->
  <polygon points="30,65 50,57 70,65 65,80 45,80" fill="url(#grad)" opacity="0.75"/>
  <polygon points="75,65 95,57 115,65 110,80 90,80" fill="url(#grad)" opacity="1"/>
  <polygon points="120,65 140,57 160,65 155,80 135,80" fill="url(#grad)" opacity="0.75"/>
  
  <!-- Tredje rad - sentrum -->
  <polygon points="50,100 70,92 90,100 85,115 65,115" fill="url(#grad)" opacity="0.85"/>
  <polygon points="100,100 120,92 140,100 135,115 115,115" fill="url(#grad)" opacity="1"/>
  <polygon points="150,100 170,92 190,100 185,115 165,115" fill="url(#grad)" opacity="0.75"/>
  
  <!-- Fjerde rad -->
  <polygon points="30,135 50,127 70,135 65,150 45,150" fill="url(#grad)" opacity="0.7"/>
  <polygon points="75,135 95,127 115,135 110,150 90,150" fill="url(#grad)" opacity="0.95"/>
  <polygon points="120,135 140,127 160,135 155,150 135,150" fill="url(#grad)" opacity="0.7"/>
  
  <!-- Nedre rad -->
  <polygon points="50,170 70,162 90,170 85,185 65,185" fill="url(#grad)" opacity="0.75"/>
  <polygon points="100,170 120,162 140,170 135,185 115,185" fill="url(#grad)" opacity="0.85"/>
  
  <!-- Sentral puls -->
  <circle cx="100" cy="105" r="5" fill="url(#grad)"/>
</svg>
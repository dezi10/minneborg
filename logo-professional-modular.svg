<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-symbol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="soft-shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Modular symbol design - som bokser som transformerer -->
  <!-- Top-venstre boks -->
  <rect x="35" y="40" width="45" height="45" fill="url(#grad-symbol)" opacity="0.9" rx="4" filter="url(#soft-shadow)"/>
  
  <!-- Top-høyre boks -->
  <rect x="120" y="40" width="45" height="45" fill="url(#grad-symbol)" opacity="0.7" rx="4" filter="url(#soft-shadow)" transform="rotate(15 142 62)"/>
  
  <!-- Nedre venstre boks -->
  <rect x="45" y="115" width="48" height="48" fill="url(#grad-symbol)" opacity="0.8" rx="4" filter="url(#soft-shadow)" transform="rotate(-10 69 139)"/>
  
  <!-- Nedre høyre boks -->
  <rect x="110" y="120" width="45" height="45" fill="url(#grad-symbol)" opacity="0.6" rx="4" filter="url(#soft-shadow)" transform="rotate(20 132 142)"/>
  
  <!-- Forbindelseslinje -->
  <path d="M 80 65 Q 100 90 100 115" fill="none" stroke="url(#grad-symbol)" stroke-width="2" opacity="0.4" stroke-dasharray="3,2"/>
  
  <!-- Sentral punkt -->
  <circle cx="100" cy="90" r="3.5" fill="url(#grad-symbol)" opacity="0.8"/>
</svg>
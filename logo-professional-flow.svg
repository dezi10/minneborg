<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-flow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <filter id="subtle-shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Flytende, organiske former som representerer dataflyt -->
  <path d="M 30 80 Q 50 50 80 60 Q 100 65 120 50 Q 150 30 170 70" 
        fill="none" stroke="url(#grad-flow)" stroke-width="4.5" stroke-linecap="round" filter="url(#subtle-shadow)"/>
  
  <path d="M 20 100 Q 40 120 70 110 Q 100 105 130 120 Q 160 130 180 100" 
        fill="none" stroke="url(#grad-flow)" stroke-width="4.5" stroke-linecap="round" filter="url(#subtle-shadow)"/>
  
  <path d="M 35 140 Q 70 130 100 140 Q 130 145 165 135" 
        fill="none" stroke="url(#grad-flow)" stroke-width="4.5" stroke-linecap="round" filter="url(#subtle-shadow)"/>
  
  <!-- Små node-punkter -->
  <circle cx="80" cy="60" r="3.5" fill="url(#grad-flow)" opacity="0.7" filter="url(#subtle-shadow)"/>
  <circle cx="120" cy="50" r="3" fill="url(#grad-flow)" opacity="0.6"/>
  <circle cx="100" cy="105" r="4" fill="url(#grad-flow)"/>
  <circle cx="100" cy="140" r="3.5" fill="url(#grad-flow)" opacity="0.7"/>
</svg>
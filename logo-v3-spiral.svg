<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Spiralerende form som viser dynamikk -->
  <path d="M 100 40 Q 140 50 150 90 Q 140 130 100 140 Q 60 130 50 90 Q 60 60 90 55 Q 115 58 125 80" 
        stroke="url(#grad)" stroke-width="9" fill="none" stroke-linecap="round"/>
  
  <!-- Indre sirkler som viser tilknytning -->
  <circle cx="100" cy="90" r="28" fill="none" stroke="url(#grad)" stroke-width="3" opacity="0.5"/>
  <circle cx="100" cy="90" r="15" fill="none" stroke="url(#grad)" stroke-width="3" opacity="0.4"/>
  <circle cx="100" cy="90" r="5" fill="url(#grad)"/>
  
  <!-- Utstraaling -->
  <line x1="100" y1="40" x2="100" y2="20" stroke="url(#grad)" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <line x1="150" y1="90" x2="170" y2="90" stroke="url(#grad)" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
</svg>
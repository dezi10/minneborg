<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Bakgrunn -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#gradMain)" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Sikkerhetslås med data flow -->
  <g filter="url(#glow)">
    <!-- Lås-skarp topp -->
    <path d="M 100 30 Q 120 30 120 50 L 120 65 Q 100 75 80 65 L 80 50 Q 80 30 100 30 Z" 
          fill="none" stroke="url(#gradMain)" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Lås-body -->
    <rect x="75" y="65" width="50" height="50" rx="8" 
          fill="none" stroke="url(#gradMain)" stroke-width="5"/>
    
    <!-- Nøkkelhull -->
    <circle cx="100" cy="95" r="6" fill="none" stroke="url(#gradMain)" stroke-width="4"/>
  </g>
  
  <!-- Data particles som flyter ut -->
  <g filter="url(#glow)">
    <!-- Øvre høyre -->
    <line x1="130" y1="45" x2="155" y2="25" stroke="url(#gradMain)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <circle cx="158" cy="22" r="4" fill="url(#gradMain)" opacity="0.9"/>
    
    <!-- Høyre -->
    <line x1="135" y1="90" x2="165" y2="90" stroke="url(#gradMain)" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <circle cx="168" cy="90" r="4" fill="url(#gradMain)" opacity="0.8"/>
    
    <!-- Nedre høyre -->
    <line x1="130" y1="135" x2="155" y2="160" stroke="url(#gradMain)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <circle cx="158" cy="163" r="4" fill="url(#gradMain)" opacity="0.9"/>
  </g>
  
  <!-- Venstre side - sekund lys -->
  <g filter="url(#glow)" opacity="0.5">
    <line x1="65" y1="60" x2="35" y2="35" stroke="url(#gradMain)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="32" cy="32" r="3" fill="url(#gradMain)"/>
    
    <line x1="65" y1="100" x2="30" y2="100" stroke="url(#gradMain)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="27" cy="100" r="3" fill="url(#gradMain)"/>
  </g>
  
  <!-- Sentral glow -->
  <circle cx="100" cy="100" r="25" fill="url(#gradMain)" opacity="0.08"/>
</svg>